<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="linha"><h1>Coup</h1></div>
    <div class="escolhas">
        <button onclick="startGame()">Começar Jogo</button>    
        <div id="config" class="escondido">
            <label for="Nplayers">Numero de jogadores:</label>
            <select name="" id="Nplayers">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
            <div id="nome">
                <input id="names" type='text' placeholder="Nome 1:">
                <input id="names" type='text' placeholder="Nome 2:">
            </div>

            <div id="ultDiv">
                <label class="ult" for="semULT">
                    <h3>Sem Ultimate</h3>
                    <input id="semULT" type="radio" checked name="ultimate">
                </label>
                <label class="ult" for="comULT">
                    <h3>Com Ultimate</h3>
                    <input id="comULT" type="radio" name="ultimate">
                </label>
            </div>
        </div>
        <button onclick="toggleConfig()">Configurações</button>
        
        <a href="https://www.google.com">
            <button class="exit">Sair</button>
        </a>
    </div>

    <div class="overLay escondido"></div>
    <div class="overLayMaior escondido"></div>
    <main>

        <header class="escondido">
            <div class="infoDaRodada"></div> 

            <div class="espaco"></div>

            <div class="divShowCardButton">
                <button class="showCard escondido">👁 Ver minhas cartas</button>
            </div>
        </header>

        <div class="container escondido"></div>
        
        <div class="fundoDuvida escondido">
            <div class="duvida">
                <h3><strong>DÚVIDA</strong>❗</h3>

                <p class="duvidaText"></p>
                <button class="buttonPassar" onclick="passarDuvida()">Passar vez</button>
                <button class="buttonDuvida" onclick="duvidar()">Dúvidar</button>
            </div>
        </div>

        <div class="fundoResolverAcao escondido">
            <div class="resolverAcao"></div>
        </div>
        

        
        <div class="informacoes"></div>
        <div class="painel-acoes escondido">
            <div class="chooseCard escondido"></div>
            
            <div class="acoesCard tipoAcao">
                <h3>Ações de Personagem</h3>
                <div class="action">
                    <button class="bPersonagem botaoDoGolpe" onclick="acao('taxar')">Taxar</button>
                    <button class="bPersonagem botaoDoGolpe" onclick="acao('assassinar')">Assassinar</button>
                    <button class="bPersonagem botaoDaRenda" onclick="acao('trocar')">Trocar</button>
                    <button class="bPersonagem" onclick="acao('roubar')">Roubar</button>
                </div>
            </div>
            
            

            <div class="acoesGerais tipoAcao">
                <h3>Ações Gerais</h3>
                <div class="action">
                    <button class="bGeral botaoDaAjuda" onclick="acao('renda')">Renda</button>
                    <button class="bGeral botaoDaAjuda" onclick="acao('ajuda_externa')">Ajuda Externa</button>
                    <button class="bGeral botaoDoGolpe" onclick="acao('golpe')">Golpe</button>
                </div>
            </div>
        </div>
        
    </main>
    
    <script src="script.js"></script>
</body>
</html>
